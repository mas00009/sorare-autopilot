<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sorare Autopilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080d;--card:#11141f;--line:#1e2334;--line2:#2a3148;--ink:#eef1f8;--dim:#8b95ad;--faint:#5c6479;
 --go:#34d399;--warn:#fbbf24;--stop:#fb7185;--v:#a78bfa;--v2:#7c5cf0;--r:13px}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,-apple-system,system-ui,sans-serif;text-wrap:pretty;
 background:radial-gradient(1000px 500px at 12% -10%,#181240 0%,transparent 60%),radial-gradient(800px 420px at 90% 0%,#062338 0%,transparent 55%),var(--bg);
 background-attachment:fixed;min-height:100vh}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.022em;font-weight:700}
a{color:inherit;text-decoration:none}
.wrap{max-width:1240px;margin:0 auto;padding:14px 16px 28px}

/* ---- one bar ---- */
.bar{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;
 background:linear-gradient(140deg,#161b2e 0%,#0d1019 65%);border:1px solid var(--line2);
 border-radius:18px;padding:0 8px;min-height:68px;
 box-shadow:0 18px 40px -26px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.04)}
.zone{display:flex;align-items:center;gap:13px;padding:12px 18px;position:relative}
.zone+.zone::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:1px;
 background:linear-gradient(180deg,transparent,var(--line2) 22%,var(--line2) 78%,transparent)}
.brand{gap:12px;padding-left:12px}
.logo{width:40px;height:40px;flex:none;display:block;object-fit:contain;
 filter:drop-shadow(0 4px 12px rgba(124,92,240,.35))}
.brand h1{font-size:1.06rem;line-height:1.15;white-space:nowrap}
.brand .acct{display:block;color:var(--faint);font-size:.73rem;font-weight:550;margin-top:2px;white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:2px;min-width:0}
.stack b{font-size:1.12rem;font-weight:760;letter-spacing:-.025em;white-space:nowrap;
 font-variant-numeric:tabular-nums;line-height:1.15}
.stack s{color:var(--faint);font-size:.66rem;text-transform:uppercase;letter-spacing:.12em;
 font-weight:700;text-decoration:none;white-space:nowrap}
.orb{width:9px;height:9px;border-radius:99px;background:var(--go);flex:none;
 box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pl 2.4s ease-out infinite}
.paused .orb{background:var(--stop);animation:none;box-shadow:0 0 12px rgba(251,113,133,.6)}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}70%{box-shadow:0 0 0 10px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
@media(prefers-reduced-motion:reduce){.orb{animation:none}}
.coin{width:26px;height:30px;object-fit:contain;flex:none;filter:drop-shadow(0 3px 8px rgba(0,0,0,.6))}
.spacer{flex:1 1 auto;min-width:8px}
.act{padding-right:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:12px;
 padding:12px 20px;min-height:44px;font-weight:700;
 font-size:.9rem;white-space:nowrap;transition:filter .12s,transform .12s,box-shadow .12s;cursor:pointer;border:0}
.btn:hover{filter:brightness(1.09);transform:translateY(-1px)}
.btn.stop{background:linear-gradient(140deg,#e2536b,#b8354d);color:#fff;box-shadow:0 10px 24px -12px rgba(226,83,107,.9)}
.btn.play{background:linear-gradient(140deg,#34d399,#0f9f72);color:#04231a;box-shadow:0 10px 24px -12px rgba(52,211,153,.9)}
.pair{display:flex;flex-direction:column;gap:7px}
/* Equal columns, so the pair reads as one control rather than two odd shapes
   sized by their own labels. The caption then centres across both. */
.pair .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair .btn{width:100%}
.pair s{color:var(--faint);font-size:.66rem;text-transform:uppercase;letter-spacing:.12em;
 font-weight:700;text-decoration:none;white-space:nowrap;text-align:center}
.btn.off{background:#161b29;color:var(--faint);box-shadow:none;cursor:default;
 box-shadow:inset 0 0 0 1px var(--line2);pointer-events:none}
.btn.off:hover{filter:none;transform:none}
.btn .live{width:8px;height:8px;border-radius:99px;background:currentColor;
 box-shadow:0 0 0 0 currentColor;animation:pl2 2.4s ease-out infinite}
@keyframes pl2{0%{box-shadow:0 0 0 0 rgba(255,255,255,.45)}70%{box-shadow:0 0 0 9px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
@media(prefers-reduced-motion:reduce){.btn .live{animation:none}}
.sq{width:11px;height:11px;background:currentColor;border-radius:3px}
.tri{border-left:11px solid currentColor;border-top:7px solid transparent;border-bottom:7px solid transparent}
/* ---- tabs ---- */
nav{display:flex;gap:7px;overflow-x:auto;margin:14px 0 12px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:99px;
 padding:8px 15px;font:inherit;font-size:.85rem;font-weight:620;white-space:nowrap;cursor:pointer}
nav button:hover{border-color:var(--line2);color:var(--ink)}
nav button[aria-selected=true]{background:linear-gradient(140deg,#2a2160,#1b1640);border-color:#43368c;color:#fff}
nav button .dot{display:inline-block;width:6px;height:6px;border-radius:99px;background:var(--warn);margin-left:6px;vertical-align:middle}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px}
.card.narrow{max-width:940px}
.card.narrow .prose{max-width:none}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.71rem;font-weight:650;border:1px solid var(--line2);color:var(--dim);white-space:nowrap}
.pill.go{color:var(--go);border-color:#1c4d3c;background:#0d2a21}
.pill.warn{color:var(--warn);border-color:#584311;background:#2a2008}
.pill.bad{color:var(--stop);border-color:#5c2733;background:#2a1017}
.pill.vv{color:var(--v);border-color:#3a2f6b;background:#191338}
.head{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:10px}
.head h3{font-size:1rem}
.steps{display:flex;gap:4px}
.steps i{width:26px;height:5px;border-radius:99px;background:#1a2030}
.steps i.done{background:linear-gradient(90deg,var(--v2),#5eead4)}
.steps i.now{background:var(--v)}
.xi{display:grid;gap:11px;grid-template-columns:repeat(5,1fr)}
.p{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0b0e16}
.p.cap{border-color:#4a3c8f;box-shadow:0 0 18px -8px rgba(124,92,240,.8)}
.p img{width:100%;aspect-ratio:5/7;object-fit:cover;display:block}
.p .b{padding:8px 9px 10px}
.p .nm{font-weight:670;font-size:.83rem;line-height:1.2;text-wrap:balance}
.p .fx{color:var(--dim);font-size:.71rem;margin-top:2px}
.p .xp{margin-top:6px;font-size:1.15rem;font-weight:780;letter-spacing:-.03em;white-space:nowrap;
 background:linear-gradient(120deg,#c4b5fd,#7dd3fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag,.capt{position:absolute;top:7px;border-radius:6px;padding:1px 6px;font-size:.66rem;font-weight:700}
.tag{left:7px;background:#070911d9;border:1px solid var(--line2);color:var(--dim)}
.capt{right:7px;background:linear-gradient(140deg,var(--v),#6d4fe0);color:#120c26}
.tot{display:flex;flex-wrap:wrap;gap:7px 16px;align-items:baseline;margin-top:13px}
.tot b{font-size:1.85rem;font-weight:800;letter-spacing:-.04em;white-space:nowrap}
.barp{height:7px;background:#161b29;border-radius:99px;overflow:hidden;margin-top:9px;max-width:460px}
.barp i{display:block;height:100%;background:linear-gradient(90deg,var(--v2),#5eead4)}
.msg{margin-top:13px;display:flex;gap:15px;align-items:flex-start;border-radius:12px;padding:13px 16px;
 border:1px solid #584311;background:linear-gradient(140deg,#241b08,#171205)}
.msg .big{font-size:1.5rem;font-weight:790;letter-spacing:-.03em;line-height:1.1;color:var(--warn);white-space:nowrap}
.msg .big s{display:block;font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;
 font-weight:700;color:#9a7a2a;text-decoration:none;margin-top:3px}
.msg p{margin:0;font-size:.86rem;color:#d9c48c;max-width:62ch}
.msg.good{border-color:#1c4d3c;background:linear-gradient(140deg,#0c2a20,#071711)}
.msg.good .big{color:var(--go)} .msg.good .big s{color:#3f8e73} .msg.good p{color:#a7d8c4}
/* Held out: one row per reason, names gathered. Repeating the same phrase once
   per player was four lines saying one thing. */
.held{margin-top:15px;border-top:1px solid var(--line);padding-top:12px}
.held h4{margin:0 0 8px;font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;
 color:var(--faint);font-weight:700}
.held dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 16px;align-items:baseline}
.held dt{font-size:.78rem;color:var(--warn);white-space:nowrap}
.held dd{margin:0;font-size:.82rem;color:var(--dim)}
@media(max-width:620px){.held dl{grid-template-columns:1fr;gap:1px 0}.held dd{margin-bottom:7px}}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.9rem}
th{text-align:left;font-weight:700;color:var(--faint);font-size:.69rem;text-transform:uppercase;letter-spacing:.1em;padding:0 10px 7px 0}
td{padding:7px 10px 7px 0;border-top:1px solid var(--line)}
.muted{color:var(--dim)}
ul.rej{list-style:none;padding:0;margin:11px 0 0;columns:3;column-gap:24px}
ul.rej li{color:var(--dim);font-size:.82rem;margin-bottom:3px;break-inside:avoid}
.prose{max-width:72ch;color:var(--dim)}
code{background:#171c2b;border:1px solid var(--line2);border-radius:5px;padding:1px 6px;font-size:.85em}
.k4{display:grid;gap:11px;grid-template-columns:repeat(4,1fr)}
.k4 div{background:#0e1220;border:1px solid var(--line);border-radius:11px;padding:12px 14px}
.k4 s{display:block;color:var(--faint);font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;text-decoration:none}
.k4 b{display:block;font-size:1.5rem;font-weight:780;letter-spacing:-.03em;
 line-height:1.15;margin:3px 0 2px;white-space:nowrap}
.k4 .muted{display:block;font-size:.76rem;line-height:1.35}
@media(max-width:900px){.xi{grid-template-columns:repeat(3,1fr)}ul.rej{columns:2}.k4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){
 .wrap{padding:10px 12px 24px}
 .bar{padding:4px 6px;border-radius:15px}
 .zone{padding:10px 12px;gap:10px}
 .zone+.zone::before{top:10px;bottom:10px}
 .brand{padding-left:8px;width:100%}
 .brand+.zone::before{display:none}
 .bar h1{font-size:1rem}
 .spacer{display:none}
 .act{width:100%;padding:0 8px 10px}
 .pair{align-items:stretch;width:100%}
 .pair .row{width:100%}
 .pair s{text-align:center}
 .btn{flex:1;justify-content:center;padding:13px}
 .xi{grid-template-columns:repeat(2,1fr);gap:9px}
 ul.rej{columns:1}
 code{overflow-wrap:anywhere}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar" id="bar"><span class="muted">Loading…</span></div>
  <nav id="tabs"></nav>
  <div id="panel"></div>
</div>
<script>
const EDIT='https://github.com/mas00009/sorare-autopilot/edit/main/docs/control.json';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const when=i=>i?new Date(i).toLocaleString(undefined,{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
const ago=i=>{if(!i)return'never';const m=Math.round((Date.now()-new Date(i))/6e4);return m<1?'just now':m<60?m+'m ago':Math.round(m/60)+'h ago'};
const cdown=i=>{if(!i)return'—';let s=Math.floor((new Date(i)-Date.now())/1000);if(s<0)return'locked';
 const d=Math.floor(s/86400);s-=d*86400;const h=Math.floor(s/3600);const m=Math.floor((s-h*3600)/60);
 return d?`${d}d ${h}h`:h?`${h}h ${String(m).padStart(2,'0')}m`:`${m}m`};
const JOIN=/\b(a|an|the|of|to|in|on|at|for|and|or|but|with|is|are|be|by|as|from|that|this|it|we|you|our|your|can|will|so|not|only|no|its|their)\s+/gi;
function bind(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
 const t=n.parentElement?.tagName;return(t==='CODE'||t==='SCRIPT'||t==='STYLE')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}});
 const ns=[];let n;while((n=w.nextNode()))ns.push(n);
 for(const x of ns){if(!/\S/.test(x.nodeValue))continue;
  x.nodeValue=x.nodeValue.replace(JOIN,(m,a)=>a+' ').replace(/(\S+)\s+(\S+\s*)$/,'$1 $2')}}

// Raw API values must never reach the screen. Sorare's enums are internal
// identifiers, not English: LINEUP_SET and PRE_MATCHDAY_LOCKED mean something
// to the API and nothing to a reader.
const STATE={
  PLAYABLE:'Open for entry', LINEUP_SET:'Lineup in', CLAIMABLE:'Reward ready',
  CLAIMED:'Claimed', LIVE:'Playing now', LOCKED:'Locked',
  PRE_MATCHDAY_LOCKED:'Not open yet', FAILED:'Missed the target',
};
const TASK={
  DAILY_ACTION:'Daily training', DECISIVE_PLAYER_PICKER:'Decisive player picker',
  CARDS_COUNT_TARGET:'Collect cards', COMPLETE_COLLECTIONS_COUNT_TARGET:'Complete a collection',
  TASK_APPEARANCE_SCORE:'Player hits 100 points', TASKS_TRACK:'Collection track',
};
const REWARD={InGameCurrency:'coins', Experience:'XP', CardShard:'essence',
  AnyCard:'a card', CardPacks:'a card pack', Monetary:'cash'};
const human=(v,map)=>map[v]??String(v??'')
  .toLowerCase().replace(/_/g,' ').replace(/^./,c=>c.toUpperCase());
const titled=s=>String(s??'').replace(/\b([a-z])/g,(m,c)=>c.toUpperCase());

let D=null,TAB=0;

const LOGO_SVG=`<svg class="logo" viewBox="0 0 40 40" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="lg" x1="4" y1="3" x2="36" y2="37" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b6cff"/><stop offset=".55" stop-color="#5b8dff"/><stop offset="1" stop-color="#2fd4c4"/>
    </linearGradient>
  </defs>
  <rect x="1.2" y="1.2" width="37.6" height="37.6" rx="11.5" fill="url(#lg)"/>
  <rect x="1.2" y="1.2" width="37.6" height="37.6" rx="11.5" fill="#05060b" fill-opacity=".62"/>
  <rect x="1.9" y="1.9" width="36.2" height="36.2" rx="11" stroke="#fff" stroke-opacity=".16"/>
  <circle cx="20" cy="20" r="10.2" stroke="url(#lg)" stroke-width="1.6" stroke-opacity=".85"/>
  <circle cx="20" cy="20" r="3.5" fill="url(#lg)"/>
  <path d="M20 4.6v5M20 30.4v5M4.6 20h5M30.4 20h5" stroke="url(#lg)" stroke-width="1.8" stroke-linecap="round"/>
</svg>`;

window.LOGO_SVG=LOGO_SVG;   // the inline onerror handler needs it on window

function topbar(d){
  const ct=d.control??{},paused=!!ct.paused,fail=d.health.failStreak;
  const mark=`<img class="logo" src="img/logo.png" alt="" onerror="this.outerHTML=LOGO_SVG">`;
  return `<div class="zone brand">${mark}
      <span><h1>Sorare Autopilot</h1><span class="acct">${esc(d.account)} · ${esc(d.squad)}</span></span></div>

    <div class="zone"><span class="stack"><b class="cd">${cdown(d.schedule.nextLock)}</b><s>to lock</s></span></div>

    <div class="zone">
      <img class="coin" src="img/essence.png" alt="" onerror="this.remove()">
      <span class="stack"><b>${d.balances.essence??'—'}</b><s>essence</s></span>
      <img class="coin" src="img/gem.png" alt="" onerror="this.remove()" style="margin-left:9px">
      <span class="stack"><b>${d.balances.gems??'—'}</b><s>gems</s></span></div>

    ${fail>=3?`<div class="zone"><span class="pill bad">failing ×${fail}</span></div>`:''}
    <span class="spacer"></span>
    <div class="zone act"><span class="pair">
      <span class="row">
        ${paused
          ? `<a class="btn play" href="${EDIT}" target="_blank" rel="noopener"><i class="tri"></i>Start</a>`
          : `<span class="btn play off"><i class="live"></i>Running</span>`}
        ${paused
          ? `<span class="btn off"><i class="sq"></i>Stop</span>`
          : `<a class="btn stop" href="${EDIT}" target="_blank" rel="noopener"><i class="sq"></i>Stop</a>`}
      </span>
      <s>${paused ? 'paused, nothing runs' : `checking every ${d.schedule.cadenceMin} min`}</s>
    </span></div>`;
}

function surfacePanel(s){
  const pl=s.plan;
  const lvl=s.level!=null&&s.totalLevels?`<span class="pill vv">Level ${s.level} of ${s.totalLevels}</span>`:'';
  const dots=(s.ladder??[]).map(x=>`<i class="${x.state==='CLAIMED'?'done':(x.level===s.level?'now':'')}" title="Level ${x.level} · ${x.target} pts"></i>`).join('');
  const rw=(s.rewards??[]).map(r=>r.kind==='pack'?`<span class="pill">Pays a ${r.cards}-card pack</span>`
    :r.kind==='essence'?`<span class="pill">Pays ${r.amount} essence</span>`
    :`<span class="pill">Pays ${esc(human(r.kind,REWARD))}</span>`).join('');
  const st={LINEUP_SET:'go',PLAYABLE:'go',CLAIMABLE:'warn',LIVE:'vv',FAILED:'bad'}[s.state]||'';

  if(!s.candidates.length) return `<div class="card">
    <div class="head"><h3>${s.target?`Target ${s.target} points`:'Step'}</h3>${lvl}<span class="pill ${st}">${esc(human(s.state,STATE))}</span></div>
    ${dots?`<div class="steps">${dots}</div>`:''}${rw?`<div style="margin-top:10px">${rw}</div>`:''}
    <p class="prose" style="margin:13px 0 0">No eligible cards yet. This step opens for entry closer to its matchday, and the bot fills it then.</p></div>`;

  const five=s.candidates.slice(0,5),tot=five.reduce((t,c)=>t+c.expected,0),pct=s.target?Math.min(100,tot/s.target*100):0;
  const waiting=pl&&pl.clearsTarget===false;
  return `<div class="card">
    <div class="head"><h3>${s.target?`Target ${s.target} points`:'Step'}</h3>${lvl}
      <span class="pill ${st}">${esc(human(s.state,STATE))}</span>${rw}</div>
    ${dots?`<div class="steps">${dots}</div>`:''}
    <div class="xi" style="margin-top:12px">${five.map((c,i)=>`
      <div class="p${i?'':' cap'}">
        ${c.picture?`<img src="${esc(c.picture)}" alt="${esc(c.player)}" loading="lazy">`:`<div style="aspect-ratio:5/7"></div>`}
        <span class="tag">${esc(c.position)}</span>${i?'':'<span class="capt">C</span>'}
        <div class="b"><div class="nm">${esc(c.player)}</div>
          <div class="fx">${c.opponent?`${c.home?'vs':'@'} ${esc(c.opponent)}`:'no fixture'}</div>
          <div class="fx">L15 ${c.average??'—'} · L5 ${c.formL5??'—'}</div>
          <div class="xp">${c.expected}</div></div></div>`).join('')}</div>
    <div class="tot"><b>${tot.toFixed(0)}</b><span class="muted">projected</span>
      ${s.target?`<span class="muted">target ${s.target}</span>
      <span class="pill ${tot>=s.target?'go':'warn'}">${tot>=s.target?'clears target':Math.round(s.target-tot)+' short'}</span>`:''}</div>
    ${s.target?`<div class="barp"><i style="width:${pct}%"></i></div>`:''}
    ${waiting?`<div class="msg">
      <span class="big">${pl.shortfall}<s>points short</s></span>
      <p>The best five available across the whole window reach <b>${pl.projected}</b> against a target of
        <b>${s.target}</b>. Entering that loses a heart for nothing, so no lineup goes in until the pool can clear it.</p></div>`:''}
    ${pl&&pl.clearsTarget&&pl.lock?`<div class="msg good">
      <span class="big">${Math.round(pl.projected-s.target)}<s>points clear</s></span>
      <p>Locks ${when(pl.lock)}${pl.tradedPointsForTime>0?`, giving up ${pl.tradedPointsForTime} points to lock a day later and keep reacting to team news`:''}.</p></div>`:''}
    ${heldOut(s.rejected)}
  </div>`;
}

/** Gather the held-out players under their reason instead of repeating it. */
function heldOut(rejected){
  if(!rejected||!rejected.length) return '';
  const by=new Map();
  for(const c of rejected){
    const r=(c.blocked??'unavailable').replace(/^only /,'').replace(/\s*\(.*\)$/,'');
    if(!by.has(r)) by.set(r,[]);
    by.get(r).push(c.player);
  }
  const rows=[...by.entries()].sort((a,b)=>b[1].length-a[1].length);
  const n=rejected.length;
  return `<div class="held"><h4>Held out · ${n}</h4><dl>${rows.map(([r,ns])=>
    `<dt>${esc(r.charAt(0).toUpperCase()+r.slice(1))}</dt><dd>${esc(ns.join(', '))}</dd>`).join('')}</dl></div>`;
}

function fixturesPanel(d){
  if(!d.fixtures.length) return `<div class="card"><p class="prose" style="margin:0">No upcoming fixtures for your players in this window.</p></div>`;
  return `<div class="card"><table><thead><tr><th>Kickoff</th><th>Match</th><th>Your players</th></tr></thead><tbody>
    ${d.fixtures.map(f=>`<tr><td>${when(f.kickoff)}</td><td>${esc(f.team)} ${f.home?'vs':'@'} ${esc(f.opponent)}</td>
      <td class="muted">${esc(f.players.join(', '))}</td></tr>`).join('')}</tbody></table></div>`;
}

function accuracyPanel(d){
  const a=d.accuracy,b=d.backtest;
  let h='<div class="card narrow">';
  h+= a.n?`<div class="k4">
      <div><s>Steps</s><b>${a.steps}</b><span class="muted">${a.hit} hit target</span></div>
      <div><s>Bias</s><b>${a.bias>0?'+':''}${a.bias}</b><span class="muted">under zero = over-projecting</span></div>
      <div><s>Mean error</s><b>${a.mae}</b><span class="muted">points per player</span></div>
      <div><s>Blanks</s><b>${Math.round(a.blankRate*100)}%</b><span class="muted">scored nothing</span></div></div>`
    : `<p class="prose" style="margin:0">No finished steps recorded yet. Each one stores what every player was
       projected to score, against what they actually scored, so these weights can be checked against reality.</p>`;
  if(b) h+=`<h3 style="margin:16px 0 8px;font-size:.95rem">Backtest on past games</h3>
    <div class="k4">
      <div><s>Samples</s><b>${b.samples}</b><span class="muted">${b.players} players</span></div>
      <div><s>Current RMSE</s><b>${b.current.rmse.toFixed(1)}</b><span class="muted">form ${b.current.formWeight}, home ${b.current.homeAdvantage}</span></div>
      <div><s>Best RMSE</s><b>${b.best.rmse.toFixed(1)}</b><span class="muted">form ${b.best.formWeight}, home ${b.best.homeAdvantage}</span></div>
      <div><s>Gain</s><b>${b.improvementRmse}</b><span class="muted">points of error removed</span></div></div>
    <p class="prose" style="margin:12px 0 0">Walk-forward: every prediction uses only games played before it, so nothing leaks backwards.
      An error near ${b.current.rmse.toFixed(0)} against typical scores of 40 to 70 makes a single-player
      projection a rough guide rather than a forecast. A five-player total is steadier than any one of them.</p>`;
  return h+'</div>';
}

function controlsPanel(d){
  const ct=d.control??{};
  const rows=[['paused','Stops everything',ct.paused],['packsEnabled','Buys essence packs',ct.packsEnabled!==false],
    ['lineupsEnabled','Sets lineups',ct.lineupsEnabled!==false],['claimsEnabled','Claims rewards',ct.claimsEnabled!==false]];
  return `<div class="card narrow"><table><thead><tr><th>Switch</th><th>Does</th><th>Now</th></tr></thead><tbody>
    ${rows.map(([k,v,on])=>`<tr><td><code>${k}</code></td><td class="muted">${v}</td>
      <td><span class="pill ${k==='paused'?(on?'bad':'go'):(on?'go':'warn')}">${on?'on':'off'}</span></td></tr>`).join('')}
    </tbody></table>
    <p class="prose" style="margin:13px 0 0">The bot rereads these every pass, so a change lands within minutes.
      Editing needs your GitHub login, and that is what keeps the controls yours.</p>
    <p style="margin:12px 0 0"><a class="btn stop" href="${EDIT}" target="_blank" rel="noopener">Edit the controls</a></p></div>`;
}

function render(d){
  D=d;
  document.getElementById('bar').className='bar'+(d.control?.paused?' paused':'');
  document.getElementById('bar').innerHTML=topbar(d);

  const tabs=[...d.surfaces.map((s,i)=>({label:titled(s.surface.replace(/\s*\(.*\)/,'')),
      warn:s.plan?.clearsTarget===false||s.state==='CLAIMABLE',fn:()=>surfacePanel(s)})),
    {label:'Fixtures',fn:()=>fixturesPanel(d)},
    {label:'Accuracy',fn:()=>accuracyPanel(d)},
    {label:'Controls',fn:()=>controlsPanel(d)}];
  if(TAB>=tabs.length)TAB=0;

  document.getElementById('tabs').innerHTML=tabs.map((t,i)=>
    `<button role="tab" aria-selected="${i===TAB}" data-i="${i}">${esc(t.label)}${t.warn?'<span class="dot"></span>':''}</button>`).join('');
  document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;TAB=+b.dataset.i;render(D)};

  const p=document.getElementById('panel');
  p.innerHTML=tabs[TAB].fn();
  bind(p);
}

setInterval(()=>{if(D){const el=document.querySelector('.cd');
  if(el)el.textContent=cdown(D.schedule.nextLock)}},30000);
const load=()=>fetch('data.json?t='+Date.now()).then(r=>r.json()).then(render)
  .catch(e=>{document.getElementById('bar').innerHTML=`<span class="muted">Could not load data.json. ${esc(e.message)}</span>`});
load();setInterval(load,120000);
</script>
</body>
</html>
