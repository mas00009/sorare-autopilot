<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sorare Autopilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07080d;--card:#11141f;--line:#1e2334;--line2:#2a3148;--ink:#eef1f8;--dim:#8b95ad;--faint:#5c6479;
 --go:#34d399;--warn:#fbbf24;--stop:#fb7185;--v:#a78bfa;--v2:#7c5cf0;--r:13px}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,-apple-system,system-ui,sans-serif;text-wrap:pretty;
 background:radial-gradient(1000px 500px at 12% -10%,#181240 0%,transparent 60%),radial-gradient(800px 420px at 90% 0%,#062338 0%,transparent 55%),var(--bg);
 background-attachment:fixed;min-height:100vh}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.022em;font-weight:700}
a{color:inherit;text-decoration:none}
.wrap{max-width:1240px;margin:0 auto;padding:14px 16px 28px}

/* ---- one bar ---- */
.bar{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;
 background:linear-gradient(140deg,#161b2e 0%,#0d1019 65%);border:1px solid var(--line2);
 border-radius:18px;padding:0 8px;min-height:68px;
 box-shadow:0 18px 40px -26px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.04)}
.zone{display:flex;align-items:center;gap:13px;padding:12px 18px;position:relative}
.zone+.zone::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:1px;
 background:linear-gradient(180deg,transparent,var(--line2) 22%,var(--line2) 78%,transparent)}
.brand{gap:12px;padding-left:12px}
.logo{width:40px;height:40px;flex:none;display:block;object-fit:contain;
 filter:drop-shadow(0 4px 12px rgba(124,92,240,.35))}
.brand h1{font-size:1.06rem;line-height:1.15;white-space:nowrap}
.brand .acct{display:block;color:var(--faint);font-size:.73rem;font-weight:550;margin-top:2px;white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:2px;min-width:0}
.stack b{font-size:1.12rem;font-weight:760;letter-spacing:-.025em;white-space:nowrap;
 font-variant-numeric:tabular-nums;line-height:1.15}
.stack s{color:var(--faint);font-size:.66rem;text-transform:uppercase;letter-spacing:.12em;
 font-weight:700;text-decoration:none;white-space:nowrap}
.orb{width:9px;height:9px;border-radius:99px;background:var(--go);flex:none;
 box-shadow:0 0 0 0 rgba(52,211,153,.6);animation:pl 2.4s ease-out infinite}
.paused .orb{background:var(--stop);animation:none;box-shadow:0 0 12px rgba(251,113,133,.6)}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(52,211,153,.5)}70%{box-shadow:0 0 0 10px rgba(52,211,153,0)}100%{box-shadow:0 0 0 0 rgba(52,211,153,0)}}
@media(prefers-reduced-motion:reduce){.orb{animation:none}}
.coin{width:26px;height:30px;object-fit:contain;flex:none;filter:drop-shadow(0 3px 8px rgba(0,0,0,.6))}
.spacer{flex:1 1 auto;min-width:8px}
.act{padding-right:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:12px;
 padding:12px 20px;min-height:44px;font-weight:700;
 font-size:.9rem;white-space:nowrap;transition:filter .12s,transform .12s,box-shadow .12s;cursor:pointer;border:0}
.btn:hover{filter:brightness(1.09);transform:translateY(-1px)}
.btn.stop{background:linear-gradient(140deg,#e2536b,#b8354d);color:#fff;box-shadow:0 10px 24px -12px rgba(226,83,107,.9)}
.btn.play{background:linear-gradient(140deg,#34d399,#0f9f72);color:#04231a;box-shadow:0 10px 24px -12px rgba(52,211,153,.9)}
.live-pill{display:inline-flex;align-items:center;gap:10px;border-radius:99px;padding:9px 20px 9px 17px;
 border:1px solid #1c4d3c;background:linear-gradient(140deg,#0e2e23,#0a1a15)}
.live-pill b{color:var(--go);font-size:.95rem;font-weight:700;letter-spacing:.01em}
.live-pill.off{border-color:#5c2733;background:linear-gradient(140deg,#2a1017,#190a0e)}
.live-pill.off b{color:var(--stop)}
.pair{display:flex;flex-direction:column;gap:7px}
/* Equal columns, so the pair reads as one control rather than two odd shapes
   sized by their own labels. The caption then centres across both. */
.pair .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair .btn{width:100%}
.pair s{color:var(--faint);font-size:.66rem;text-transform:uppercase;letter-spacing:.12em;
 font-weight:700;text-decoration:none;white-space:nowrap;text-align:center}
.btn.off{background:#161b29;color:var(--faint);box-shadow:none;cursor:default;
 box-shadow:inset 0 0 0 1px var(--line2);pointer-events:none}
.btn.off:hover{filter:none;transform:none}
.btn .live{width:8px;height:8px;border-radius:99px;background:currentColor;
 box-shadow:0 0 0 0 currentColor;animation:pl2 2.4s ease-out infinite}
@keyframes pl2{0%{box-shadow:0 0 0 0 rgba(255,255,255,.45)}70%{box-shadow:0 0 0 9px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
@media(prefers-reduced-motion:reduce){.btn .live{animation:none}}
.sq{width:11px;height:11px;background:currentColor;border-radius:3px}
.tri{border-left:11px solid currentColor;border-top:7px solid transparent;border-bottom:7px solid transparent}
/* ---- tabs ---- */
nav{display:flex;align-items:center;gap:7px;margin:14px 0 12px;scrollbar-width:none;flex-wrap:wrap}
nav .tabs{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;min-width:0}
nav .tabs::-webkit-scrollbar{display:none}
nav .nums{margin-left:auto;display:flex;align-items:center;gap:20px;padding-right:4px}
nav .nums .stack b{font-size:1.02rem}
nav .nums .v{display:flex;align-items:center;gap:9px;white-space:nowrap}
nav .nums .lock{display:flex;align-items:center;gap:9px}
nav .nums .lock svg{width:22px;height:22px;flex:none;opacity:.9}
nav .nums .lock img.coin{width:24px;height:28px}
nav::-webkit-scrollbar{display:none}
nav button{background:var(--card);border:1px solid var(--line);color:var(--dim);border-radius:99px;
 padding:8px 15px;font:inherit;font-size:.85rem;font-weight:620;white-space:nowrap;cursor:pointer}
nav button:hover{border-color:var(--line2);color:var(--ink)}
nav button[aria-selected=true]{background:linear-gradient(140deg,#2a2160,#1b1640);border-color:#43368c;color:#fff}
nav button .dot{display:inline-block;width:6px;height:6px;border-radius:99px;background:var(--warn);margin-left:6px;vertical-align:middle}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px}
.card.narrow{max-width:none}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.71rem;font-weight:650;border:1px solid var(--line2);color:var(--dim);white-space:nowrap}
.pill.go{color:var(--go);border-color:#1c4d3c;background:#0d2a21}
.pill.warn{color:var(--warn);border-color:#584311;background:#2a2008}
.pill.bad{color:var(--stop);border-color:#5c2733;background:#2a1017}
.pill.vv{color:var(--v);border-color:#3a2f6b;background:#191338}
.head{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-bottom:10px}
.head h3{font-size:1rem}
/* Lives on the current step. Sorare shows them as a heart per attempt, filled
   for the ones still left, so the dashboard reads the same way as the game. */
.lives{margin-left:auto;display:flex;gap:5px;align-items:center;padding:5px 8px;border-radius:9px;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);flex:0 0 auto}
.lives svg{width:17px;height:17px;display:block}
.lives .on{fill:var(--go);stroke:rgba(0,0,0,.45);stroke-width:1}
.lives .off{fill:none;stroke:rgba(255,255,255,.28);stroke-width:1.6}
.lives b{font:600 .72rem/1 var(--f);color:var(--dim);letter-spacing:.02em;margin-left:3px;white-space:nowrap}
@media(max-width:560px){.lives{padding:4px 6px;gap:4px}.lives svg{width:15px;height:15px}.lives b{display:none}}
.steps{display:flex;gap:4px}
.steps i{width:26px;height:5px;border-radius:99px;background:#1a2030}
.steps i.done{background:linear-gradient(90deg,var(--v2),#5eead4)}
.steps i.now{background:var(--v)}
.xi{display:grid;gap:11px;grid-template-columns:repeat(5,1fr)}
.p{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#0b0e16}
.p.cap{border-color:#4a3c8f;box-shadow:0 0 18px -8px rgba(124,92,240,.8)}
.p img{width:100%;aspect-ratio:5/7;object-fit:cover;display:block}
.p .b{padding:8px 9px 10px}
.p .nm{font-weight:670;font-size:.83rem;line-height:1.2;text-wrap:balance}
.p .fx{color:var(--dim);font-size:.71rem;margin-top:2px}
.p .xp{margin-top:6px;font-size:1.15rem;font-weight:780;letter-spacing:-.03em;white-space:nowrap;
 background:linear-gradient(120deg,#c4b5fd,#7dd3fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag,.capt{position:absolute;top:7px;border-radius:6px;padding:1px 6px;font-size:.66rem;font-weight:700}
.tag{left:7px;background:#070911d9;border:1px solid var(--line2);color:var(--dim)}
.capt{right:7px;background:linear-gradient(140deg,var(--v),#6d4fe0);color:#120c26}
.tot{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;margin:20px 0 0}
/* Score and target are one fact, so they read as a fraction under one label
   rather than three items floating at equal distance. */
.score{display:flex;flex-direction:column;gap:3px}
.score .n{display:flex;align-items:baseline;gap:2px;line-height:1;white-space:nowrap}
.score .n b{font-size:1.95rem;font-weight:800;letter-spacing:-.04em}
.score .n i{font-style:normal;font-size:1.35rem;font-weight:700;color:var(--faint);letter-spacing:-.03em}
.score s{color:var(--faint);font-size:.66rem;text-transform:uppercase;letter-spacing:.13em;
 font-weight:700;text-decoration:none}
.barp{height:8px;background:#161b29;border-radius:99px;overflow:hidden;margin:16px 0 4px;width:100%}
.barp i{display:block;height:100%;border-radius:99px;transition:width .5s ease;
 background:linear-gradient(90deg,var(--v2),#5eead4)}
/* The verdict lives on the totals line now, so it needs no box of its own. */
.verdict{display:inline-flex;align-items:center;gap:10px;border-radius:99px;padding:7px 17px;
 font-size:.83rem;border:1px solid #584311;background:#221a07;color:#e2c581}
.verdict b{font-size:1rem;font-weight:790;color:var(--warn);letter-spacing:-.02em}
.verdict.good{border-color:#1c4d3c;background:#0d2a21;color:#a7d8c4}
.verdict.good b{color:var(--go)}
/* The number keeps a fixed column so the copy beside it starts on one line
   whatever the viewport, instead of shifting with the digit count. */
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.9rem}
th{text-align:left;font-weight:700;color:var(--faint);font-size:.69rem;text-transform:uppercase;letter-spacing:.1em;padding:0 10px 7px 0}
td{padding:7px 10px 7px 0;border-top:1px solid var(--line)}
.muted{color:var(--dim)}
.fx-tbl td,.fx-tbl th{padding:8px 12px 8px 0}
.fx-tbl .ko b{display:block;font-weight:640}
.fx-tbl .ko s{color:var(--faint);font-size:.75rem;text-decoration:none}
.fx-tbl .m{font-weight:600;white-space:nowrap}
.fx-tbl .m .at{color:var(--faint);font-weight:500;padding:0 5px}
.fx-tbl .rk{display:inline-block;margin-left:5px;font-size:.68rem;color:var(--faint);
 border:1px solid var(--line2);border-radius:5px;padding:0 4px;vertical-align:middle}
.fx-tbl .hm{font-size:.68rem;color:var(--faint);border:1px solid var(--line2);
 border-radius:5px;padding:0 5px;margin-left:7px}
.fx-tbl .pl{color:var(--dim);font-size:.85rem}
.fx-tbl .pts{text-align:right;font-weight:750;white-space:nowrap;
 background:linear-gradient(120deg,#c4b5fd,#7dd3fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.fx-tbl .cmp{color:var(--faint);font-size:.78rem;white-space:nowrap}
@media(max-width:760px){.fx-tbl .cmp,.fx-tbl th.cmp{display:none}}
ul.rej{list-style:none;padding:0;margin:11px 0 0;columns:3;column-gap:24px}
ul.rej li{color:var(--dim);font-size:.82rem;margin-bottom:3px;break-inside:avoid}
.prose{max-width:104ch;color:var(--dim);text-wrap:pretty}
code{background:#171c2b;border:1px solid var(--line2);border-radius:5px;padding:1px 6px;font-size:.85em}
.lede{display:flex;flex-wrap:wrap;align-items:center;gap:14px 26px;margin-bottom:20px}
.lede .score .n b{font-size:2.3rem}
.lede p{margin:0;flex:1;min-width:260px;max-width:88ch;color:var(--dim);font-size:.88rem;line-height:1.5}
h4.sub{margin:22px 0 10px;font-size:.69rem;text-transform:uppercase;letter-spacing:.13em;
 color:var(--faint);font-weight:700}
h4.sub:first-of-type{margin-top:0}
.prose.sm{font-size:.85rem;line-height:1.55;margin:13px 0 0}
ul.plain{margin:0;padding-left:19px;color:var(--dim);font-size:.87rem;line-height:1.6;max-width:92ch}
ul.plain li{margin-bottom:5px}
ul.plain b{color:var(--ink);font-weight:620}
/* toggles */
.sw{position:relative;width:46px;height:26px;border-radius:99px;background:#1c2233;
 border:1px solid var(--line2);cursor:pointer;transition:background .16s,border-color .16s;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:99px;
 background:#6b7690;transition:transform .16s,background .16s}
.sw[aria-checked=true]{background:#123a2c;border-color:#1c6b4f}
.sw[aria-checked=true]::after{transform:translateX(20px);background:var(--go)}
.sw.danger[aria-checked=true]{background:#3a1420;border-color:#6b1c31}
.sw.danger[aria-checked=true]::after{background:var(--stop)}
.sw:disabled{opacity:.45;cursor:progress}
.ctl-row{display:flex;align-items:center;gap:14px;padding:11px 0;border-top:1px solid var(--line)}
.ctl-row:first-of-type{border-top:0}
.ctl-row .t{flex:1;min-width:0}
.ctl-row .t b{display:block;font-size:.92rem;font-weight:640}
.ctl-row .t s{display:block;color:var(--dim);font-size:.79rem;text-decoration:none;margin-top:1px}
.tok{margin-top:14px;border-top:1px solid var(--line);padding-top:13px}
.btn.small{padding:9px 16px;font-size:.85rem;border-radius:10px;background:#1c2233;color:var(--ink);
 border:1px solid var(--line2)}
.btn.small:hover{border-color:var(--v)}
.btn.ghosty{background:transparent;color:var(--dim)}
.tok ol{margin:0 0 13px;padding-left:20px;color:var(--dim);font-size:.85rem;line-height:1.65;max-width:88ch}
.tok ol li{margin-bottom:3px}
.tok ol b{color:var(--ink);font-weight:620}
.tok a.lnk{color:var(--v);text-decoration:underline;text-underline-offset:2px}
.tok .row2{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.disc{margin-top:14px;font-size:.78rem;color:var(--faint)}
.disc button{background:none;border:0;color:var(--faint);font:inherit;text-decoration:underline;
 text-underline-offset:2px;cursor:pointer;padding:0}
.disc button:hover{color:var(--stop)}
.tok input{width:100%;max-width:420px;background:#0c1018;border:1px solid var(--line2);color:var(--ink);
 border-radius:9px;padding:9px 12px;font:inherit;font-size:.86rem}
.tok .go{margin-top:9px}
.note{font-size:.84rem;color:var(--dim);max-width:104ch}
.flash{margin-top:10px;font-size:.84rem}
.flash.ok{color:var(--go)} .flash.err{color:var(--stop)}
@media(max-width:900px){.xi{grid-template-columns:repeat(3,1fr)}ul.rej{columns:2}}
@media(max-width:620px){
 .wrap{padding:10px 12px 24px}
 .bar{padding:4px 6px;border-radius:15px}
 .zone{padding:10px 12px;gap:10px}
 .zone+.zone::before{top:10px;bottom:10px}
 .brand{padding-left:8px;width:100%}
 .brand+.zone::before{display:none}
 .bar h1{font-size:1rem}
 .spacer{display:none}
 nav .nums{margin-left:0;width:100%;justify-content:space-between;gap:10px;padding:2px 2px 0}
 nav .tabs{width:100%}
 .act{width:100%;padding:0 8px 10px}
 .pair{align-items:stretch;width:100%}
 .pair .row{width:100%}
 .pair s{text-align:center}
 .btn{flex:1;justify-content:center;padding:13px}
 .xi{grid-template-columns:repeat(2,1fr);gap:9px}
 ul.rej{columns:1}
 code{overflow-wrap:anywhere}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar" id="bar"><span class="muted">Loading…</span></div>
  <nav id="tabs"></nav>
  <div id="panel"></div>
</div>
<script>
const EDIT='https://github.com/mas00009/sorare-autopilot/edit/main/docs/control.json';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const when=i=>i?new Date(i).toLocaleString(undefined,{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
const ago=i=>{if(!i)return'never';const m=Math.round((Date.now()-new Date(i))/6e4);return m<1?'just now':m<60?m+'m ago':Math.round(m/60)+'h ago'};
const cdown=i=>{if(!i)return'—';let s=Math.floor((new Date(i)-Date.now())/1000);if(s<0)return'locked';
 const d=Math.floor(s/86400);s-=d*86400;const h=Math.floor(s/3600);const m=Math.floor((s-h*3600)/60);
 return d?`${d}d ${h}h`:h?`${h}h ${String(m).padStart(2,'0')}m`:`${m}m`};
const JOIN=/\b(a|an|the|of|to|in|on|at|for|and|or|but|with|is|are|be|by|as|from|that|this|it|we|you|our|your|can|will|so|not|only|no|its|their)\s+/gi;
function bind(root){const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode(n){
 const t=n.parentElement?.tagName;return(t==='CODE'||t==='SCRIPT'||t==='STYLE')?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}});
 const ns=[];let n;while((n=w.nextNode()))ns.push(n);
 for(const x of ns){if(!/\S/.test(x.nodeValue))continue;
  x.nodeValue=x.nodeValue.replace(JOIN,(m,a)=>a+' ').replace(/(\S+)\s+(\S+\s*)$/,'$1 $2')}}

// Raw API values must never reach the screen. Sorare's enums are internal
// identifiers, not English: LINEUP_SET and PRE_MATCHDAY_LOCKED mean something
// to the API and nothing to a reader.
const STATE={
  PLAYABLE:'Open for entry', LINEUP_SET:'Lineup in', CLAIMABLE:'Reward ready',
  CLAIMED:'Claimed', LIVE:'Playing now', LOCKED:'Locked',
  PRE_MATCHDAY_LOCKED:'Not open yet', FAILED:'Missed the target',
};
const TASK={
  DAILY_ACTION:'Daily training', DECISIVE_PLAYER_PICKER:'Decisive player picker',
  CARDS_COUNT_TARGET:'Collect cards', COMPLETE_COLLECTIONS_COUNT_TARGET:'Complete a collection',
  TASK_APPEARANCE_SCORE:'Player hits 100 points', TASKS_TRACK:'Collection track',
};
const REWARD={InGameCurrency:'coins', Experience:'XP', CardShard:'essence',
  AnyCard:'card', CardPacks:'card pack', Monetary:'cash'};
const human=(v,map)=>map[v]??String(v??'')
  .toLowerCase().replace(/_/g,' ').replace(/^./,c=>c.toUpperCase());
const titled=s=>String(s??'').replace(/\b([a-z])/g,(m,c)=>c.toUpperCase());
const TITLE=s=>String(s??'').replace(/\b[a-z]/g,c=>c.toUpperCase()).replace(/\bXp\b/,'XP');

let D=null,TAB=0;

const LOGO_SVG=`<svg class="logo" viewBox="0 0 40 40" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="lg" x1="4" y1="3" x2="36" y2="37" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b6cff"/><stop offset=".55" stop-color="#5b8dff"/><stop offset="1" stop-color="#2fd4c4"/>
    </linearGradient>
  </defs>
  <rect x="1.2" y="1.2" width="37.6" height="37.6" rx="11.5" fill="url(#lg)"/>
  <rect x="1.2" y="1.2" width="37.6" height="37.6" rx="11.5" fill="#05060b" fill-opacity=".62"/>
  <rect x="1.9" y="1.9" width="36.2" height="36.2" rx="11" stroke="#fff" stroke-opacity=".16"/>
  <circle cx="20" cy="20" r="10.2" stroke="url(#lg)" stroke-width="1.6" stroke-opacity=".85"/>
  <circle cx="20" cy="20" r="3.5" fill="url(#lg)"/>
  <path d="M20 4.6v5M20 30.4v5M4.6 20h5M30.4 20h5" stroke="url(#lg)" stroke-width="1.8" stroke-linecap="round"/>
</svg>`;

window.LOGO_SVG=LOGO_SVG;   // the inline onerror handler needs it on window

function topbar(d){
  const ct=d.control??{},paused=!!ct.paused,fail=d.health.failStreak;
  const mark=`<img class="logo" src="img/logo.png" alt="" onerror="this.outerHTML=LOGO_SVG">`;
  return `<div class="zone brand">${mark}
      <span><h1>Sorare Autopilot</h1><span class="acct">${esc(d.account)} · ${esc(d.squad)}</span></span></div>
    <span class="spacer"></span>

    ${fail>=3?`<div class="zone"><span class="pill bad">failing ×${fail}</span></div>`:''}
    <div class="zone act">
      <span class="live-pill${paused?' off':''}">
        <span class="orb"></span><b>${paused?'Paused':'Live'}</b>
      </span></div>`;
}

/** One pill: the gap, and what the bot is doing about it. */
function verdict(s,pl,tot){
  if(pl&&pl.clearsTarget===false)
    return `<span class="verdict"><b>&minus;${Math.round(pl.shortfall)}</b>
      Entering would lose a heart, so nothing goes in yet.</span>`;
  if(pl&&pl.clearsTarget&&pl.lock)
    return `<span class="verdict good"><b>+${Math.round(pl.projected-s.target)}</b>
      Locks ${when(pl.lock)}${pl.tradedPointsForTime>0?`, ${pl.tradedPointsForTime} points given up to lock later`:''}.</span>`;
  const gap=Math.round(s.target-tot);
  return `<span class="verdict${gap<=0?' good':''}"><b>${gap<=0?'+'+Math.abs(gap):'&minus;'+gap}</b>
    ${gap<=0?'clears the target':'short of the target'}</span>`;
}

/* Sorare's own numbers: maxLineupsCount is the total, remainingLineupsCount the
   ones still standing. A squad step is collaborative and has no lives, so it
   gets nothing rather than a row of invented hearts. */
function livesBadge(l){
  if(!l||!l.of) return '';
  const path='M8 14.2s-5.4-3.3-6.6-6.6C.5 5.3 2 3 4.3 3c1.5 0 2.6.9 3.2 1.8h1c.6-.9 1.7-1.8 3.2-1.8C14 3 15.5 5.3 14.6 7.6 13.4 10.9 8 14.2 8 14.2Z';
  const h=n=>`<svg viewBox="0 0 16 16" aria-hidden="true"><path class="${n?'on':'off'}" d="${path}"/></svg>`;
  const hearts=Array.from({length:l.of},(_,i)=>h(i<l.left)).join('');
  return `<span class="lives" title="${l.left} of ${l.of} lives left on this step">${hearts}<b>${l.left}/${l.of}</b></span>`;
}

function surfacePanel(s){
  const pl=s.plan;
  const lvl=s.level!=null&&s.totalLevels?`<span class="pill vv">Level ${s.level} of ${s.totalLevels}</span>`:'';
  const dots=(s.ladder??[]).map(x=>`<i class="${x.state==='CLAIMED'?'done':(x.level===s.level?'now':'')}" title="Level ${x.level} · ${x.target} pts"></i>`).join('');
  const rw=(s.rewards??[]).map(r=>r.kind==='pack'?`<span class="pill">${TITLE(`Pays ${r.cards}-card pack`)}</span>`
    :r.kind==='essence'?`<span class="pill">${TITLE(`Pays ${r.amount} essence`)}</span>`
    :`<span class="pill">${esc(TITLE('Pays '+human(r.kind,REWARD)))}</span>`).join('');
  const st={LINEUP_SET:'go',PLAYABLE:'go',CLAIMABLE:'warn',LIVE:'vv',FAILED:'bad'}[s.state]||'';

  if(!s.candidates.length) return `<div class="card">
    <div class="head"><h3>${s.target?`Target ${s.target} points`:'Step'}</h3>${lvl}<span class="pill ${st}">${esc(TITLE(human(s.state,STATE)))}</span>${livesBadge(s.lives)}</div>
    ${dots?`<div class="steps">${dots}</div>`:''}${rw?`<div style="margin-top:10px">${rw}</div>`:''}
    <p class="prose" style="margin:13px 0 0">No eligible cards yet. This step opens for entry closer to its matchday, and the bot fills it then.</p></div>`;

  const five=s.candidates.slice(0,5),tot=five.reduce((t,c)=>t+c.expected,0),pct=s.target?Math.min(100,tot/s.target*100):0;
  const waiting=pl&&pl.clearsTarget===false;
  return `<div class="card">
    <div class="head"><h3>${s.target?`Target ${s.target} points`:'Step'}</h3>${lvl}
      <span class="pill ${st}">${esc(TITLE(human(s.state,STATE)))}</span>${rw}${livesBadge(s.lives)}</div>
    ${dots?`<div class="steps">${dots}</div>`:''}
    <div class="xi" style="margin-top:12px">${five.map((c,i)=>`
      <div class="p${i?'':' cap'}">
        ${c.picture?`<img src="${esc(c.picture)}" alt="${esc(c.player)}" loading="lazy">`:`<div style="aspect-ratio:5/7"></div>`}
        <span class="tag">${esc(c.position)}</span>${i?'':'<span class="capt">C</span>'}
        <div class="b"><div class="nm">${esc(c.player)}</div>
          <div class="fx">${c.opponent?`${c.home?'vs':'@'} ${esc(c.opponent)}`:'no fixture'}</div>
          <div class="fx">L15 ${c.average??'—'} · L5 ${c.formL5??'—'}</div>
          <div class="xp">${c.expected}</div></div></div>`).join('')}</div>
    <div class="tot">
      <span class="score"><span class="n"><b>${tot.toFixed(0)}</b>${s.target?`<i>&thinsp;/&thinsp;${s.target}</i>`:''}</span>
        <s>${s.target?'projected of target':'projected'}</s></span>
      ${s.target?verdict(s,pl,tot):''}</div>
    ${s.target?`<div class="barp"><i style="width:${pct}%"></i></div>`:''}

  </div>`;
}

function fixturesPanel(d){
  if(!d.fixtures.length) return `<div class="card"><p class="prose" style="margin:0">No upcoming fixtures for your players in this window.</p></div>`;
  const day=i=>new Date(i).toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
  const time=i=>new Date(i).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
  const rk=n=>n?`<span class="rk">#${n}</span>`:'';
  const total=d.fixtures.reduce((t,f)=>t+(f.points||0),0);
  return `<div class="card"><table class="fx-tbl">
    <thead><tr><th>Kickoff</th><th>Match</th><th class="cmp">Competition</th>
      <th>Your players</th><th style="text-align:right">Projected</th></tr></thead><tbody>
    ${d.fixtures.map(f=>`<tr>
      <td class="ko"><b>${day(f.kickoff)}</b><s>${time(f.kickoff)}</s></td>
      <td class="m">${esc(f.code||f.team)}${rk(f.rank)}<span class="at">${f.home?'v':'@'}</span>${esc(f.opponentCode||f.opponent)}${rk(f.opponentRank)}
        <span class="hm">${f.home?'Home':'Away'}</span></td>
      <td class="cmp">${esc(f.competition||'—')}</td>
      <td class="pl">${esc(f.players.join(', '))}</td>
      <td class="pts">${f.points?f.points.toFixed(1):'—'}</td></tr>`).join('')}
    </tbody><tfoot><tr><td colspan="4" class="muted" style="padding-top:11px">
      ${d.fixtures.length} fixtures with your players</td>
      <td class="pts" style="padding-top:11px">${total.toFixed(1)}</td></tr></tfoot></table></div>`;
}

const REPO_API='https://api.github.com/repos/mas00009/sorare-autopilot/contents/docs/control.json';
const TOKEN_KEY='sa_gh_token';
const tok=()=>{try{return localStorage.getItem(TOKEN_KEY)||''}catch{return''}};
const setTok=v=>{try{v?localStorage.setItem(TOKEN_KEY,v):localStorage.removeItem(TOKEN_KEY)}catch{}};

const SWITCHES=[
  ['paused','Pause everything','Nothing runs at all while this is on',true],
  ['packsEnabled','Buy essence packs','Opens packs to the daily 3-star',false],
  ['lineupsEnabled','Set lineups','Picks and enters teams',false],
  ['claimsEnabled','Claim rewards','Collects finished steps and missions',false],
];

async function writeControl(patch,flash){
  const t=tok();
  if(!t){flash('Add a GitHub token below first, then try again.','err');return false}
  const hdr={Authorization:`Bearer ${t}`,Accept:'application/vnd.github+json'};
  try{
    const cur=await fetch(REPO_API+'?t='+Date.now(),{headers:hdr});
    if(cur.status===401||cur.status===403){setTok('');render(D);throw new Error('That token was rejected. Paste a new one.')}
    if(!cur.ok) throw new Error(`GitHub said ${cur.status}`);
    const meta=await cur.json();
    const body={...JSON.parse(atob(meta.content.replace(/\n/g,''))),...patch};
    const put=await fetch(REPO_API,{method:'PUT',headers:{...hdr,'Content-Type':'application/json'},
      body:JSON.stringify({message:`controls: ${Object.keys(patch).join(', ')}`,
        content:btoa(JSON.stringify(body,null,2)+'\n'),sha:meta.sha})});
    if(!put.ok) throw new Error(`GitHub said ${put.status}`);
    D.control={...D.control,...patch};
    flash('Saved. The bot picks it up on its next pass, within a few minutes.','ok');
    return true;
  }catch(e){flash(e.message,'err');return false}
}

function controlsPanel(d){
  const ct=d.control??{};
  const rows=SWITCHES.map(([k,label,desc,danger])=>{
    const on=k==='paused'?!!ct.paused:ct[k]!==false;
    return `<div class="ctl-row">
      <button class="sw${danger?' danger':''}" role="switch" aria-checked="${on}" data-k="${k}" aria-label="${esc(label)}"></button>
      <span class="t"><b>${esc(label)}</b><s>${esc(desc)}</s></span></div>`;
  }).join('');

  const has=!!tok();
  // Once connected the setup block goes away entirely; a quiet link remains so a
  // bad or rotated token can still be cleared.
  const setup = has ? `<div class="disc">Connected to GitHub.
      <button id="forget">Disconnect</button></div>`
    : `<div class="tok">
      <h4 class="sub" style="margin-top:0">Connect to flip these</h4>
      <ol>
        <li>Open <a class="lnk" href="https://github.com/settings/personal-access-tokens/new"
            target="_blank" rel="noopener">GitHub's fine-grained token page</a>.</li>
        <li>Name it anything. Set <b>Expiration</b> to whatever you are comfortable with.</li>
        <li>Under <b>Repository access</b> choose <b>Only select repositories</b>, and pick
            <b>sorare-autopilot</b>.</li>
        <li>Under <b>Permissions &rarr; Repository permissions</b>, set <b>Contents</b> to
            <b>Read and write</b>. Leave everything else alone.</li>
        <li>Click <b>Generate token</b>, copy it, and paste it below.</li>
      </ol>
      <div class="row2">
        <input id="pat" type="password" placeholder="github_pat_..." autocomplete="off" spellcheck="false">
        <button class="btn small" id="savetok">Save token</button>
      </div>
      <div class="flash" id="flash"></div></div>`;

  return `<div class="card narrow">${rows}${setup}
    ${has?'<div class="flash" id="flash"></div>':''}</div>`;
}

function wireControls(){
  const flash=(m,c)=>{const el=document.getElementById('flash');if(el){el.textContent=m;el.className='flash '+(c||'')}};
  document.querySelectorAll('.sw').forEach(sw=>sw.onclick=async()=>{
    const k=sw.dataset.k,next=sw.getAttribute('aria-checked')!=='true';
    sw.disabled=true;flash('Saving…','');
    const ok=await writeControl({[k]:next},flash);
    if(ok)sw.setAttribute('aria-checked',String(next));
    sw.disabled=false;
  });
  const s=document.getElementById('savetok');
  if(s)s.onclick=()=>{const v=document.getElementById('pat').value.trim();
    if(!v){flash('Paste a token first.','err');return}setTok(v);render(D)};
  const f=document.getElementById('forget');
  if(f)f.onclick=()=>{setTok('');render(D)};
}

function render(d){
  D=d;
  document.getElementById('bar').className='bar'+(d.control?.paused?' paused':'');
  document.getElementById('bar').innerHTML=topbar(d);

  const tabs=[...d.surfaces.map((s,i)=>({label:titled(s.surface.replace(/\s*\(.*\)/,'')),
      warn:s.plan?.clearsTarget===false||s.state==='CLAIMABLE',fn:()=>surfacePanel(s)})),
    {label:'Fixtures',fn:()=>fixturesPanel(d)},
    {label:'Controls',fn:()=>controlsPanel(d)}];
  if(TAB>=tabs.length)TAB=0;

  const LOCKSVG=`<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
    <circle cx="12" cy="12" r="9" stroke="#8b95ad" stroke-width="1.9"/>
    <path d="M12 6.8V12l3.4 2.1" stroke="#8b95ad" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  window.LOCKSVG=LOCKSVG;
  const LOCKICON=`<img class="coin" src="img/lock.png" alt="" onerror="this.outerHTML=window.LOCKSVG">`;
  const nums=`<span class="nums">
    <span class="lock">${LOCKICON}<span class="stack"><b class="cd">${cdown(d.schedule.nextLock)}</b><s>team locks in</s></span></span>
    <span class="v"><img class="coin" src="img/essence.png" alt="" onerror="this.remove()">
      <span class="stack"><b>${d.balances.essence??'—'}</b><s>essence</s></span></span>
    <span class="v"><img class="coin" src="img/gem.png" alt="" onerror="this.remove()">
      <span class="stack"><b>${d.balances.gems??'—'}</b><s>gems</s></span></span></span>`;
  document.getElementById('tabs').innerHTML='<span class="tabs">'+tabs.map((t,i)=>
    `<button role="tab" aria-selected="${i===TAB}" data-i="${i}">${esc(t.label)}${t.warn?'<span class="dot"></span>':''}</button>`).join('')+'</span>'+nums;
  document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;TAB=+b.dataset.i;render(D)};

  const p=document.getElementById('panel');
  p.innerHTML=tabs[TAB].fn();
  bind(p);
  if(tabs[TAB].label==='Controls')wireControls();
}

setInterval(()=>{if(D){const el=document.querySelector('.cd');
  if(el)el.textContent=cdown(D.schedule.nextLock)}},30000);
const load=()=>fetch('data.json?t='+Date.now()).then(r=>r.json()).then(render)
  .catch(e=>{document.getElementById('bar').innerHTML=`<span class="muted">Could not load data.json. ${esc(e.message)}</span>`});
load();setInterval(load,120000);
</script>
</body>
