<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorare Autopilot</title>
<style>
  :root {
    --bg:#0b0d12; --card:#141822; --line:#222838; --ink:#e8ecf5; --dim:#8791a8;
    --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; --accent:#a78bfa;
    --measure:68ch;
  }
  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Inter,system-ui,sans-serif;
    text-wrap:pretty;
  }
  h1,h2,h3 { text-wrap:balance; margin:0; font-weight:650; letter-spacing:-.01em; }
  h1 { font-size:1.35rem; }
  h2 { font-size:.82rem; text-transform:uppercase; letter-spacing:.09em; color:var(--dim); font-weight:600; }
  h3 { font-size:1rem; }
  a { color:var(--accent); }
  .wrap { max-width:1140px; margin:0 auto; padding:28px 16px 64px; }
  header { display:flex; flex-wrap:wrap; gap:12px 20px; align-items:baseline; margin-bottom:22px; }
  .stamp { color:var(--dim); font-size:.82rem; margin-left:auto; }
  .grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; }
  .stat .n { font-size:1.7rem; font-weight:680; letter-spacing:-.02em; display:block; }
  .stat .k { color:var(--dim); font-size:.78rem; text-transform:uppercase; letter-spacing:.07em; }
  section { margin-top:26px; }
  section > h2 { margin-bottom:10px; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th { text-align:left; font-weight:600; color:var(--dim); font-size:.74rem;
       text-transform:uppercase; letter-spacing:.07em; padding:0 10px 7px 0; }
  td { padding:7px 10px 7px 0; border-top:1px solid var(--line); }
  td.num, th.num { text-align:right; padding-right:0; }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:.72rem;
          border:1px solid var(--line); color:var(--dim); white-space:nowrap; }
  .pill.ok{color:var(--ok);border-color:#1e4d33}.pill.warn{color:var(--warn);border-color:#5c4410}
  .pill.bad{color:var(--bad);border-color:#5e2626}.pill.c{color:var(--accent);border-color:#3d3168}
  .muted { color:var(--dim); }
  .note { color:var(--dim); max-width:var(--measure); }
  .rej li { color:var(--dim); font-size:.86rem; margin-bottom:3px; }
  ul.rej { list-style:none; padding:0; margin:0; columns:2; column-gap:26px; }
  @media (max-width:640px){ ul.rej{columns:1} .stamp{margin-left:0;width:100%} }
  footer { margin-top:40px; color:var(--dim); font-size:.8rem; max-width:var(--measure); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Sorare Autopilot</h1>
    <span class="pill" id="acct"></span>
    <span class="stamp" id="stamp"></span>
  </header>
  <div id="app"><p class="muted">Loading…</p></div>
  <footer>
    Generated by the autopilot on each pass. Projections are estimates, not
    promises: expected points combine a player's recent form with how likely
    they are to start, and a projection only means something once the accuracy
    figures above have a few gameweeks behind them.
  </footer>
</div>
<script>
const $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content; };
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const when = (iso) => { if (!iso) return '—'; const d = new Date(iso);
  return d.toLocaleString(undefined, { weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }); };
const ago = (iso) => { if (!iso) return 'never'; const m = Math.round((Date.now() - new Date(iso)) / 60000);
  return m < 1 ? 'just now' : m < 60 ? `${m}m ago` : `${Math.round(m/60)}h ago`; };
const stateClass = (s) => ({ LINEUP_SET:'ok', PLAYABLE:'ok', CLAIMABLE:'warn',
  PRE_MATCHDAY_LOCKED:'', LOCKED:'', LIVE:'c', FAILED:'bad' }[s] ?? '');

function lineupTable(s) {
  if (!s.candidates.length) {
    return `<p class="note">No eligible cards for this step yet — it opens closer to its matchday.</p>`;
  }
  const rows = s.candidates.slice(0, 6).map((c, i) => `
    <tr>
      <td><span class="pill">${esc(c.position)}</span></td>
      <td>${esc(c.player)}${i === 0 ? ' <span class="pill c">C</span>' : ''}</td>
      <td class="muted">${c.opponent ? `${c.home ? 'H' : 'A'} v ${esc(c.opponent)}` : '—'}</td>
      <td class="num">${c.average ?? '—'}</td>
      <td class="num">${c.formL5 ?? '—'}</td>
      <td class="num">${c.starterPct != null ? Math.round(c.starterPct) + '%' : '—'}</td>
      <td class="num"><strong>${c.expected}</strong></td>
    </tr>`).join('');
  return `<table>
    <thead><tr><th></th><th>Player</th><th>Fixture</th>
      <th class="num">L15</th><th class="num">L5</th><th class="num">Start</th><th class="num">Exp</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

function render(d) {
  document.getElementById('acct').textContent = `${d.account} · ${d.squad}`;
  document.getElementById('stamp').textContent = `updated ${ago(d.generatedAt)}`;

  const health = d.health.failStreak >= 3 ? `<span class="pill bad">failing ×${d.health.failStreak}</span>`
    : d.health.failStreak > 0 ? `<span class="pill warn">1 recent failure</span>`
    : `<span class="pill ok">healthy</span>`;

  let h = `<div class="grid">
    <div class="card stat"><span class="k">Essence</span><span class="n">${d.balances.essence ?? '—'}</span></div>
    <div class="card stat"><span class="k">Gems (never spent)</span><span class="n">${d.balances.gems ?? '—'}</span></div>
    <div class="card stat"><span class="k">Next lock</span><span class="n" style="font-size:1.05rem">${when(d.schedule.nextLock)}</span>
      <span class="k">checking every ${d.schedule.cadenceMin}m</span></div>
    <div class="card stat"><span class="k">Status</span><span class="n" style="font-size:1.05rem">${health}</span>
      <span class="k">last pass ${ago(d.schedule.lastRunAt)}</span></div>
  </div>`;

  for (const s of d.surfaces) {
    const cur = s.current.length
      ? s.current.map((p) => `${esc(p.name)}${p.captain ? ' (C)' : ''}`).join(', ')
      : '<span class="muted">none set</span>';
    h += `<section>
      <h2>${esc(s.surface)}</h2>
      <div class="card">
        <h3>${s.target ? `Target ${s.target} pts` : 'Step'}
          <span class="pill ${stateClass(s.state)}">${esc(s.state ?? '?')}</span>
          ${s.projected ? `<span class="pill">best available ≈ ${s.projected}</span>` : ''}</h3>
        <p class="note" style="margin:.6em 0 1em"><strong>In now:</strong> ${cur}</p>
        ${lineupTable(s)}
        ${s.rejected.length ? `<h2 style="margin:18px 0 8px">Held out</h2>
          <ul class="rej">${s.rejected.map((c) => `<li>${esc(c.player)} — ${esc(c.blocked)}</li>`).join('')}</ul>` : ''}
      </div>
    </section>`;
  }

  if (d.fixtures.length) {
    h += `<section><h2>Upcoming fixtures</h2><div class="card"><table>
      <thead><tr><th>Kickoff</th><th>Match</th><th>Your players</th></tr></thead><tbody>
      ${d.fixtures.map((f) => `<tr><td>${when(f.kickoff)}</td>
        <td>${esc(f.team)} ${f.home ? 'v' : '@'} ${esc(f.opponent)}</td>
        <td class="muted">${esc(f.players.join(', '))}</td></tr>`).join('')}
      </tbody></table></div></section>`;
  }

  h += `<section><h2>Projection accuracy</h2><div class="card">`;
  h += d.accuracy.n
    ? `<div class="grid">
        <div class="stat"><span class="k">Steps</span><span class="n">${d.accuracy.steps}</span><span class="k">${d.accuracy.hit} hit target</span></div>
        <div class="stat"><span class="k">Bias</span><span class="n">${d.accuracy.bias > 0 ? '+' : ''}${d.accuracy.bias}</span><span class="k">negative = over-projecting</span></div>
        <div class="stat"><span class="k">Mean error</span><span class="n">${d.accuracy.mae}</span><span class="k">points per player</span></div>
        <div class="stat"><span class="k">Blank rate</span><span class="n">${Math.round(d.accuracy.blankRate * 100)}%</span><span class="k">scored nothing</span></div>
      </div>${d.accuracy.steps < 4 ? '<p class="note" style="margin-top:12px">Too few samples to tune anything on yet.</p>' : ''}`
    : `<p class="note">Nothing measured yet. Each finished step records what was projected against
       what actually scored; until several have completed, the projections above are untested.</p>`;
  h += `</div></section>`;

  document.getElementById('app').replaceChildren($(h));
}

fetch('data.json?t=' + Date.now())
  .then((r) => r.json()).then(render)
  .catch((e) => { document.getElementById('app').innerHTML =
    `<p class="note">Could not load data.json — ${esc(e.message)}</p>`; });
</script>
</body>
</html>
